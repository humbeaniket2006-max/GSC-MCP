name: keep-alive
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        env:
          RENDER_URL: ${{ vars.RENDER_URL }}
        run: |
          test -n "$RENDER_URL" || { echo "Set repo variable RENDER_URL"; exit 1; }
          curl -fsS --retry 3 --retry-delay 20 --max-time 60 "${RENDER_URL%/}/health"
